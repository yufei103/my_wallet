<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/my_wallet/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="my_money_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>my_money_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="loading_indicator" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #ffffff; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center;">
    <img src="icons/Icon-192.png" alt="Logo" style="width: 80px; height: 80px; margin-bottom: 20px; border-radius: 12px;">
    <div class="loader"></div>
    <style>
      .loader {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3498db; /* 你可以改成你喜欢的蓝色 */
        border-radius: 50%;
        width: 30px;
        height: 30px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </div>

  <script>
    // 定义一个移除 Loading 的函数
    function removeLoading() {
      const loader = document.getElementById('loading_indicator');
      if (loader) {
        loader.style.transition = 'opacity 0.5s'; // 加个淡出动画
        loader.style.opacity = '0'; // 变透明
        setTimeout(() => loader.remove(), 500); // 0.5秒后彻底从 DOM 删除
      }
    }

    // 设置一个“定时检查员”
    // 每 100 毫秒检查一次：Flutter 的画面出来了吗？
    const checkFlutter = setInterval(() => {
      // Flutter Web 会生成 <flt-glass-pane> (CanvasKit) 或 <flutter-view> (HTML)
      const flutterApp = document.querySelector('flt-glass-pane') || document.querySelector('flutter-view');
      
      if (flutterApp) {
        // 找到了！说明 Flutter 已经加载完毕
        clearInterval(checkFlutter); // 停止检查
        
        // 为了体验更丝滑，延迟 500ms 再移除，确保第一帧已经画好了
        setTimeout(removeLoading, 500);
      }
    }, 100);

    // 【保险措施】万一上面的检查失效，10秒后强制移除 loading，避免死循环
    setTimeout(removeLoading, 10000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
