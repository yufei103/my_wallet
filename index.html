<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="my_money_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>my_money_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="loading_indicator" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #ffffff; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center;">
    <img src="icons/Icon-192.png" alt="Logo" style="width: 80px; height: 80px; margin-bottom: 20px; border-radius: 12px;">
    <div class="loader"></div>
    <style>
      .loader {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3498db; /* 你可以改成你喜欢的蓝色 */
        border-radius: 50%;
        width: 30px;
        height: 30px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </div>

  <script>
    window.addEventListener('load', function(ev) {
      // 这里的逻辑通常由 Flutter 自动处理，但为了保险，
      // Flutter 启动后会覆盖整个页面，loading_indicator 自然就被盖住了。
      // 或者你可以写个脚本在 flutter 引擎初始化后 remove 这个 div。
      // 最简单的做法是：不用管，Flutter 渲染出来的画面层级会盖住它。
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
